<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penugasan Operator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* CSS KHUSUS OPERATOR: Aktif jika tabel diberi class "operator-mode" lewat JS */
        .operator-mode th, .operator-mode td {
            padding: 4px 2px !important; /* Jarak atas-bawah 4px, kiri-kanan 2px (sangat rapat) */
            font-size: 11px !important; /* Ukuran teks diperkecil agar muat di layar HP */
            word-wrap: break-word;
            white-space: normal;
        }
        .operator-mode input[type="number"] {
            width: 45px !important; /* Kotak input angka lebih pendek */
            padding: 2px !important;
            height: 24px !important;
            font-size: 11px !important;
        }
        .operator-mode button {
            padding: 2px 6px !important; /* Tombol simpan lebih imut */
            font-size: 10px !important;
        }
        /* Menghilangkan scrollbar pada kontainer tabel khusus operator agar terlihat menyatu */
        .operator-container-mode {
            overflow-x: hidden !important; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased p-2 md:p-8">

    <div id="app" class="max-w-6xl mx-auto hidden">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4 md:mb-6">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-gray-900">Sistem Penugasan Produksi</h1>
                <p id="user-info" class="text-xs md:text-sm text-gray-500"></p>
            </div>
            <button id="btn-export" class="hidden bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 text-sm font-medium">
                📥 Export
            </button>
        </div>

        <!-- Form Admin (Hanya muncul jika token Admin) -->
        <div id="admin-form-container" class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 mb-8 hidden">
            <h2 class="text-lg font-semibold mb-4">Input Plan Penugasan Baru</h2>
            <form id="plan-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="date" id="input-tanggal" required class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                
                <select id="input-nama" required class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="" disabled selected>Pilih Operator</option>
                </select>
                
                <select id="input-bagian" required class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="" disabled selected>Pilih Bagian</option>
                </select>
                
                <select id="input-mesin" required class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="" disabled selected>Pilih Nomor Mesin</option>
                </select>
                
                <select id="input-lensa" required class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="" disabled selected>Pilih Tipe Lensa</option>
                </select>

                <input type="number" id="input-plan" placeholder="Plan Qty" required class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                
                <button type="submit" class="md:col-span-3 bg-blue-600 text-white py-2 rounded shadow hover:bg-blue-700 font-medium">
                    Simpan Plan
                </button>
            </form>
        </div>

        <!-- Tabel Data -->
        <div id="table-container" class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-x-auto">
            <table id="data-table" class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-sm">
                        <th class="p-3 border-b">Tanggal</th>
                        <th class="p-3 border-b admin-only">Operator</th>
                        <th class="p-3 border-b">Bagian</th>
                        <th class="p-3 border-b">Mesin</th>
                        <th class="p-3 border-b">Tipe Lensa</th>
                        <th class="p-3 border-b">Plan Qty</th>
                        <th class="p-3 border-b">Actual Qty</th>
                        <th class="p-3 border-b">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="text-sm">
                    <!-- Data akan dirender lewat JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Halaman Error Akses -->
    <div id="error-screen" class="max-w-md mx-auto mt-20 bg-red-50 p-6 rounded-lg text-center border border-red-200 hidden">
        <h2 class="text-xl font-bold text-red-700 mb-2">Akses Ditolak</h2>
        <p class="text-gray-700">Token URL tidak valid atau tidak ditemukan. Pastikan Anda masuk menggunakan link khusus Anda.</p>
    </div>

    <script>
        // 1. KONFIGURASI PENTING
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkNW0qW5lr49nDe37teWptHryLxWQZQGZEovCehTyVigyTg3vnUnoYiGijZ5XQ5cIz/exec'; // <-- JANGAN LUPA GANTI INI LAGI

        // 2. DATA DROPDOWN (CONST)
        const DAFTAR_OPERATOR = ["Andi", "Budi", "Siti"];
        const DAFTAR_BAGIAN = ["Coating", "Polishing", "Surfacing", "Edging", "QC"];
        const DAFTAR_MESIN = ["M-01", "M-02", "M-03", "C-01"];
        const DAFTAR_LENSA = ["Thin-Film AR", "Progressive", "Single Vision", "Bifocal"];
        
        // 3. SISTEM TOKEN 
        const users = {
            "admin-utama": { role: "admin", name: "Administrator" },
            "op-andi": { role: "operator", name: "Andi" },
            "op-budi": { role: "operator", name: "Budi" },
            "op-siti": { role: "operator", name: "Siti" }
        };

        // Identifikasi User
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        let currentUser = null;
        let globalData = [];

        // Inisialisasi Aplikasi
        function initApp() {
            if (users[token]) {
                currentUser = users[token];
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('user-info').innerText = `Masuk sebagai: ${currentUser.name} (${currentUser.role.toUpperCase()})`;
                
                if (currentUser.role === 'admin') {
                    // SETTING ADMIN: Tampilkan form, tampilkan tombol export
                    document.getElementById('admin-form-container').classList.remove('hidden');
                    document.getElementById('btn-export').classList.remove('hidden');
                    populateDropdowns();
                } else {
                    // SETTING OPERATOR: Sembunyikan kolom nama, aktifkan CSS mode hp (operator-mode)
                    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                    document.getElementById('data-table').classList.add('operator-mode');
                    document.getElementById('table-container').classList.add('operator-container-mode');
                }
                loadData();
            } else {
                document.getElementById('error-screen').classList.remove('hidden');
            }
        }

        function populateDropdowns() {
            const fillSelect = (id, arrayData) => {
                const select = document.getElementById(id);
                arrayData.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    option.textContent = item;
                    select.appendChild(option);
                });
            };

            fillSelect('input-nama', DAFTAR_OPERATOR);
            fillSelect('input-bagian', DAFTAR_BAGIAN);
            fillSelect('input-mesin', DAFTAR_MESIN);
            fillSelect('input-lensa', DAFTAR_LENSA);
        }

        async function loadData() {
            document.getElementById('table-body').innerHTML = '<tr><td colspan="8" class="text-center p-4">Memuat data...</td></tr>';
            try {
                const response = await fetch(SCRIPT_URL);
                globalData = await response.json();
                renderTable();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="8" class="text-center p-4 text-red-500">Gagal memuat data</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            let displayData = globalData;
            if (currentUser.role === 'operator') {
                displayData = globalData.filter(row => row['Nama Operator'].toLowerCase() === currentUser.name.toLowerCase());
            }

            displayData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";

                let actualHtml = row['Actual Qty'] || '-';
                let actionHtml = '-';

                if (currentUser.role === 'admin') {
                    actionHtml = `<button onclick="deleteData('${row.ID}')" class="text-red-500 hover:text-red-700 font-medium">Hapus</button>`;
                } else if (currentUser.role === 'operator') {
                    // Input HTML untuk operator
                    actualHtml = `<input type="number" id="actual-${row.ID}" value="${row['Actual Qty']}" class="border rounded bg-white text-center" placeholder="Qty">`;
                    actionHtml = `<button onclick="updateActual('${row.ID}')" class="bg-blue-100 text-blue-700 rounded hover:bg-blue-200 font-bold">Simpan</button>`;
                }

                // Format tanggal agar lebih pendek khusus operator (opsional, untuk menghemat ruang)
                let dateDisplay = row['Tanggal'];
                if(currentUser.role === 'operator' && dateDisplay.includes('-')) {
                    const d = new Date(dateDisplay);
                    if(!isNaN(d)) dateDisplay = `${d.getDate()}/${d.getMonth()+1}`;
                }

                tr.innerHTML = `
                    <td class="p-3">${dateDisplay}</td>
                    ${currentUser.role === 'admin' ? `<td class="p-3 font-medium">${row['Nama Operator']}</td>` : ''}
                    <td class="p-3">${row['Bagian']}</td>
                    <td class="p-3 text-gray-500">${row['Nomor Mesin']}</td>
                    <td class="p-3 text-gray-500">${row['Tipe Lensa']}</td>
                    <td class="p-3 font-bold text-center">${row['Plan Qty']}</td>
                    <td class="p-3 text-center">${actualHtml}</td>
                    <td class="p-3 text-center">${actionHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('plan-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Menyimpan..."; btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('action', 'create');
            formData.append('tanggal', document.getElementById('input-tanggal').value);
            formData.append('nama', document.getElementById('input-nama').value);
            formData.append('bagian', document.getElementById('input-bagian').value);
            formData.append('mesin', document.getElementById('input-mesin').value);
            formData.append('lensa', document.getElementById('input-lensa').value);
            formData.append('planQty', document.getElementById('input-plan').value);

            await fetch(SCRIPT_URL, { method: 'POST', body: formData });
            
            const tanggalSebelumnya = document.getElementById('input-tanggal').value;
            e.target.reset();
            document.getElementById('input-tanggal').value = tanggalSebelumnya;

            btn.innerText = "Simpan Plan"; btn.disabled = false;
            loadData();
        });

        async function updateActual(id) {
            const actualVal = document.getElementById(`actual-${id}`).value;
            if(!actualVal) return alert('Isi Actual Qty terlebih dahulu');
            
            const formData = new URLSearchParams();
            formData.append('action', 'update_actual');
            formData.append('id', id);
            formData.append('actualQty', actualVal);

            const btn = document.querySelector(`button[onclick="updateActual('${id}')"]`);
            btn.innerText = "...";
            btn.disabled = true;

            await fetch(SCRIPT_URL, { method: 'POST', body: formData });
            alert('Hasil aktual berhasil disimpan!');
            loadData();
        }

        async function deleteData(id) {
            if(!confirm('Hapus penugasan ini?')) return;
            const formData = new URLSearchParams();
            formData.append('action', 'delete');
            formData.append('id', id);
            await fetch(SCRIPT_URL, { method: 'POST', body: formData });
            loadData();
        }

        document.getElementById('btn-export').addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(globalData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data_Produksi");
            XLSX.writeFile(workbook, "Laporan_Penugasan_Produksi.xlsx");
        });

        initApp();
    </script>
</body>
</html>
