<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Ke Google Sheet</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f4f4f9; }
        form { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background-white: white; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h2>Hubungi Kami</h2>
    
    <form id="submit-to-google-sheet">
        <!-- PERUBAHAN: Input teks diganti menjadi elemen Select -->
        <div class="input-group">
            <label for="nama">Nama:</label>
            <select id="nama" name="nama" required>
                <option value="" disabled selected>-- Pilih Nama --</option>
            </select>
        </div>
        
       <div class="input-group">
            <label for="mesin">Mesin:</label>
            <select id="mesin" name="mesin" required>
                <option value="" disabled selected>-- Pilih Mesin --</option>
            </select>
        </div>

       <div class="input-group">
            <label for="proses">Proses:</label>
            <select id="proses" name="proses" required>
                <option value="" disabled selected>-- Pilih Proses --</option>
            </select>
        </div>

       <div class="input-group">
            <label for="lensa">Lensa:</label>
            <select id="lensa" name="lensa" required>
                <option value="" disabled selected>-- Pilih Lensa --</option>
            </select>
        </div>

        <div class="input-group">
            <label for="qtyok">Qty Ok:</label>
            <input type="number" id="qtyok" name="qtyok" required>
        </div>

        <div class="input-group">
            <label for="qtyngscrap">Qty NG Scrap:</label>
            <input type="number" id="qtyngscrap" name="qtyngscrap" required>
        </div>

        
        <div class="input-group">
            <label for="detailng">Detail NG:</label>
            <textarea id="detailng" name="detailng" rows="4" required></textarea>
        </div>
        
        <button type="submit">Kirim Data</button>
    </form>

        const form = document.getElementById('submit-to-google-sheet');

        form.addEventListener('submit', e => {

</body>
</html>
