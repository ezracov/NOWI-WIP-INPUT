<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penugasan Operator</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { margin: 0; color: var(--primary); }
        .header p { margin: 4px 0 0; color: var(--text-muted); font-size: 14px; }

        /* Card Layout */
        .card-container { display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card-header { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 12px; margin-bottom: 12px; }
        .card-header h3 { margin: 0; font-size: 16px; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; font-size: 14px; }
        .data-item span { display: block; color: var(--text-muted); font-size: 12px; }
        .data-item strong { display: block; margin-top: 2px; }

        /* Form Inputs */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: 600; }
        input[type="number"], input[type="text"], textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        
        button {
            width: 100%; background: var(--primary); color: white; border: none; padding: 12px; 
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:active { opacity: 0.8; }
        
        #loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .hidden { display: none !important; }

        /* Observer Specific */
        .summary-card { border-left: 4px solid var(--primary); }
        .progress-bar { background: #e2e8f0; border-radius: 4px; height: 8px; margin-top: 8px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="page-title">Sistem Penugasan</h2>
        <p id="page-subtitle">Memuat data...</p>
    </div>

    <div id="loading">Mengambil data dari server...</div>
    
    <div id="app" class="card-container hidden"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbx6TCbf3yEHVoBzGK9HI5JanxCJSxy91R3pEwhbgk0xf8q-nijlTWDPr6qlFg1WLWLl/exec';
        
        // Setup Const yang disiapkan untuk struktur referensi filter/input di pengembangan selanjutnya
        const CONST_NAMA_OPERATOR = []; 
        const CONST_BAGIAN = [];
        const CONST_NOMOR_MESIN = [];
        const CONST_TIPE_LENSA = [];

        // Ambil URL Parameter (Token)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token'); 
        
        const appDiv = document.getElementById('app');
        const loadingDiv = document.getElementById('loading');
        
        // Inisialisasi Aplikasi
        async function init() {
            if (!token) {
                loadingDiv.innerHTML = "Akses ditolak. Token tidak ditemukan di URL.";
                return;
            }

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                loadingDiv.classList.add('hidden');
                appDiv.classList.remove('hidden');

                if (token.toLowerCase() === 'observer') {
                    renderObserver(data);
                } else {
                    renderOperator(data, token);
                }
            } catch (error) {
                loadingDiv.innerHTML = "Gagal mengambil data. Periksa koneksi internet.";
            }
        }

        // --- RENDER OPERATOR VIEW ---
        function renderOperator(data, operatorName) {
            document.getElementById('page-title').innerText = "Work Order";
            document.getElementById('page-subtitle').innerText = `Operator: ${operatorName}`;
            
            const myTasks = data.filter(item => item['Nama Operator'] === operatorName);
            
            if (myTasks.length === 0) {
                appDiv.innerHTML = `<div class="card"><p style="text-align:center">Tidak ada tugas untuk saat ini.</p></div>`;
                return;
            }

            let html = '';
            myTasks.forEach(task => {
                html += `
                <div class="card">
                    <div class="card-header">
                        <h3>${task['Bagian']} - ${task['Tipe Lensa']}</h3>
                        <span class="badge">Mesin: ${task['Nomor Mesin']}</span>
                    </div>
                    <div class="data-grid">
                        <div class="data-item"><span>Tanggal</span><strong>${task['Tanggal Produksi'] ? new Date(task['Tanggal Produksi']).toLocaleDateString('id-ID') : '-'}</strong></div>
                        <div class="data-item"><span>Siklus</span><strong>${task['Siklus'] || '-'}</strong></div>
                        <div class="data-item"><span>Plan Qty</span><strong style="color:var(--primary); font-size:16px">${task['Plan Qty']}</strong></div>
                        <div class="data-item"><span>Status Update</span><strong id="time-${task.rowNumber}" style="font-size:11px; color:green">${task['Waktu Update'] || 'Belum diisi'}</strong></div>
                    </div>
                    
                    <div class="input-group">
                        <label>Actual Qty OK</label>
                        <input type="number" id="actual-${task.rowNumber}" value="${task['Actual Qty'] || ''}" placeholder="Masukan hasil aktual">
                    </div>
                    
                    <div class="input-group">
                        <!-- Tipe input textarea 4 baris -->
                        <label>Catatan Scrap</label>
                        <textarea id="scrap-${task.rowNumber}" rows="4" placeholder="Detail scrap...">${task['Catatan Scrap'] || ''}</textarea>
                    </div>

                    <div class="input-group">
                        <label>Catatan Repair</label>
                        <input type="text" id="repair-${task.rowNumber}" value="${task['Catatan Repair'] || ''}" placeholder="Detail repair...">
                    </div>

                    <button onclick="saveData(${task.rowNumber}, this)">Simpan Progress</button>
                </div>`;
            });
            appDiv.innerHTML = html;
        }

        // --- RENDER OBSERVER VIEW ---
        function renderObserver(data) {
            document.getElementById('page-title').innerText = "Dashboard Observer";
            document.getElementById('page-subtitle').innerText = "Ringkasan Pencapaian Keseluruhan";

            let summary = {};

            // Mengelompokkan data (Grouping)
            data.forEach(item => {
                if(!item['Bagian']) return; // Skip baris kosong
                
                let key = `${item['Bagian']} - ${item['Tipe Lensa']}`;
                if (!summary[key]) {
                    summary[key] = { bagian: item['Bagian'], lensa: item['Tipe Lensa'], plan: 0, actual: 0 };
                }
                summary[key].plan += Number(item['Plan Qty']) || 0;
                summary[key].actual += Number(item['Actual Qty']) || 0;
            });

            let html = '';
            for (const key in summary) {
                const s = summary[key];
                const percentage = s.plan > 0 ? ((s.actual / s.plan) * 100).toFixed(1) : 0;
                
                html += `
                <div class="card summary-card">
                    <div class="card-header" style="border-bottom:none; padding-bottom:0; margin-bottom:8px">
                        <h3>${s.bagian}</h3>
                        <span class="badge">${s.lensa}</span>
                    </div>
                    <div class="data-grid" style="margin-bottom:8px">
                        <div class="data-item"><span>Total Plan</span><strong>${s.plan}</strong></div>
                        <div class="data-item"><span>Total Actual</span><strong>${s.actual}</strong></div>
                    </div>
                    <div style="font-size:13px; font-weight:bold; margin-top:12px;">Ketercapaian: ${percentage}%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                    </div>
                </div>`;
            }

            if(Object.keys(summary).length === 0) {
                html = `<div class="card"><p style="text-align:center">Belum ada data tersedia.</p></div>`;
            }

            appDiv.innerHTML = html;
        }

        // --- FUNGSI UPDATE DATA KE SHEET ---
        async function saveData(rowNum, btnElement) {
            const actual = document.getElementById(`actual-${rowNum}`).value;
            const scrap = document.getElementById(`scrap-${rowNum}`).value;
            const repair = document.getElementById(`repair-${rowNum}`).value;

            btnElement.innerText = "Menyimpan...";
            btnElement.style.opacity = "0.7";

            const payload = {
                rowNumber: rowNum,
                'Actual Qty': actual,
                'Catatan Scrap': scrap,
                'Catatan Repair': repair
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                btnElement.innerText = "Tersimpan!";
                btnElement.style.background = "#16a34a"; // warna hijau
                document.getElementById(`time-${rowNum}`).innerText = result.time;

                setTimeout(() => {
                    btnElement.innerText = "Simpan Progress";
                    btnElement.style.background = "var(--primary)";
                    btnElement.style.opacity = "1";
                }, 2000);

            } catch (error) {
                alert("Gagal menyimpan data.");
                btnElement.innerText = "Coba Lagi";
                btnElement.style.opacity = "1";
            }
        }

        // Jalankan aplikasi saat halaman dimuat
        init();
    </script>
</body>
</html>
